<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إضافة إجازة مرضية</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-submit {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn-submit:hover {
            background-color: #1d4ed8;
        }
        .alert {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }
        .alert-success { background-color: #d1fae5; color: #065f46; }
        .alert-danger { background-color: #fee2e2; color: #991b1b; }
        .logout-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #dc2626;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>إضافة إجازة مرضية جديدة</h2>

    {% if msg %}
        {% if 'نجاح' in msg %}
            <div class="alert alert-success">{{ msg }}</div>
        {% else %}
            <div class="alert alert-danger">{{ msg }}</div>
        {% endif %}
    {% endif %}

    <form method="POST" action="/admin">
        <div class="form-group">
            <label>رمز الخدمة / رمز الإجازة (مثال: GSL32521258069)</label>
            <input type="text" name="service_code" required>
        </div>
        <div class="form-group">
            <label>رقم الهوية / الإقامة</label>
            <input type="text" name="national_id" required>
        </div>
        <div class="form-group">
            <label>الاسم بالعربي</label>
            <input type="text" name="name_ar" required>
        </div>
        <div class="form-group">
            <label>الاسم بالإنكليزي</label>
            <input type="text" name="name_en">
        </div>
        <div class="form-group">
            <label>مدة الإجازة (مثال: 1 يوم)</label>
            <input type="text" name="duration" required>
        </div>
        <div class="form-group">
            <label>تاريخ الدخول</label>
            <input type="text" name="admission_date">
        </div>
        <div class="form-group">
            <label>تاريخ الخروج</label>
            <input type="text" name="discharge_date">
        </div>
        <div class="form-group">
            <label>تاريخ الإصدار</label>
            <input type="text" name="issue_date">
        </div>
        <div class="form-group">
            <label>الجنسية</label>
            <input type="text" name="nationality">
        </div>
        <div class="form-group">
            <label>جهة العمل</label>
            <input type="text" name="employer">
        </div>
        <div class="form-group">
            <label>اسم الممارس الصحي</label>
            <input type="text" name="practitioner_name">
        </div>
        <div class="form-group">
            <label>المسمى الوظيفي</label>
            <input type="text" name="position">
        </div>

        <button type="submit" class="btn-submit">حفظ الإجازة المرضية</button>
    </form>

    <a href="/logout" class="logout-link">تسجيل الخروج</a>
</div>

</body>
</html>
